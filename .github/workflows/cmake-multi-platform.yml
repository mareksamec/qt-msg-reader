name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0). Leave blank to auto-derive from CMakeLists.txt + commit SHA.'
        required: false
        type: string
      build_windows:
        description: 'Also build the Windows target (skipped by default on push/PR/release).'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    # Computes the build matrix so the windows-latest leg can be left out
    # entirely (rather than just skipped) unless explicitly requested: plain
    # pushes/PRs (and releases derived from them) never set build_windows,
    # so it's Linux-only there by default. Only a manual workflow_dispatch
    # run with build_windows checked adds Windows back in.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      run: |
        linux='{"os":"ubuntu-latest","c_compiler":"gcc","cpp_compiler":"g++"}'
        windows='{"os":"windows-latest","c_compiler":"cl","cpp_compiler":"cl"}'
        if [ "${{ inputs.build_windows }}" = "true" ]; then
          echo "matrix={\"include\":[$linux,$windows]}" >> "$GITHUB_OUTPUT"
        else
          echo "matrix={\"include\":[$linux]}" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Create archive (Linux)
      if: runner.os == 'Linux'
      run: |
        cd ${{ steps.strings.outputs.build-output-dir }}
        tar -czvf qt-msg-reader-linux-x86_64.tar.gz qt-msg-reader

    - name: Create archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
        $exePath = Join-Path $buildDir "Release\qt-msg-reader.exe"
        if (Test-Path $exePath) {
            Move-Item $exePath $buildDir
        }
        Compress-Archive -Path "$buildDir\qt-msg-reader.exe" -DestinationPath "$buildDir\qt-msg-reader-windows-x86_64.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt-msg-reader-${{ matrix.os }}
        path: |
          ${{ steps.strings.outputs.build-output-dir }}/qt-msg-reader-*

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
    - name: Install build dependencies
      # Must run before checkout: archlinux:base-devel has no git, and
      # actions/checkout silently falls back to a git-less REST API tarball
      # download when it can't find one - which never creates a .git dir,
      # breaking every git command run against $GITHUB_WORKSPACE later.
      run: pacman -Syu --noconfirm --needed qt6-base cmake git

    - uses: actions/checkout@v4

    - name: Create non-root build user
      # makepkg refuses to run as root, but Actions' container jobs run as root.
      # Mark the checkout safe for git (rather than chowning it) so both root
      # (the later "git archive" step) and builder (the git+file:// clone
      # below) can run git commands against it without ownership complaints.
      run: |
        useradd -m builder
        git config --system --add safe.directory '*'

    - name: Build qt-msg-reader-git (smoke test against this commit)
      # Points the VCS source at this checkout instead of the network, so it
      # validates the PKGBUILD-git recipe against the exact commit under test
      # rather than whatever happens to already be pushed to GitHub. builder
      # can't necessarily read $GITHUB_WORKSPACE directly (Actions' container
      # work dir isn't guaranteed world-readable), so root clones it into a
      # /tmp copy owned by builder first, and that's what gets referenced.
      run: |
        git clone --no-hardlinks -q "$GITHUB_WORKSPACE" /tmp/qt-msg-reader-src
        install -d -o builder -g builder /tmp/build-git
        cp packaging/arch/PKGBUILD-git /tmp/build-git/PKGBUILD
        sed -i "s|^source=.*|source=(\"\${pkgname%-git}::git+file:///tmp/qt-msg-reader-src\")|" /tmp/build-git/PKGBUILD
        chown -R builder:builder /tmp/build-git /tmp/qt-msg-reader-src
        su builder -c 'cd /tmp/build-git && makepkg -s --noconfirm --nocheck'

    - name: Build qt-msg-reader (release artifact)
      # Same PKGBUILD that's committed, just pointed at a locally generated
      # source tarball instead of a GitHub release tag - that tag may not
      # exist yet (or ever, for a non-release push), so this can't rely on
      # downloading it.
      run: |
        pkgver=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
        install -d -o builder -g builder /tmp/build-release
        cp packaging/arch/PKGBUILD /tmp/build-release/PKGBUILD
        sed -i "s/^pkgver=.*/pkgver=${pkgver}/" /tmp/build-release/PKGBUILD
        sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" /tmp/build-release/PKGBUILD
        git archive --format=tar.gz --prefix="qt-msg-reader-${pkgver}/" \
            -o "/tmp/build-release/qt-msg-reader-${pkgver}.tar.gz" HEAD
        chown -R builder:builder /tmp/build-release
        su builder -c 'cd /tmp/build-release && makepkg -s --noconfirm --nocheck'
        mkdir -p arch-release
        cp /tmp/build-release/*.pkg.tar.zst arch-release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt-msg-reader-arch
        path: arch-release/*.pkg.tar.zst

  release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    # Never on pull_request builds; on a plain push (e.g. a PR merge to main)
    # or a manual workflow_dispatch, the job still only actually publishes
    # once approved via the "release" environment's required reviewers -
    # see the "environment:" key below. That gate is configured in repo
    # Settings -> Environments, not in this file.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: release

    steps:
    - uses: actions/checkout@v4

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          project_version=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          short_sha=$(git rev-parse --short HEAD)
          echo "value=v${project_version}-${short_sha}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create source tarball
      run: |
        mkdir -p release
        tar -czvf release/source.tar.gz --exclude='.git' --exclude='build' --exclude='artifacts' .

    - name: Move artifacts to release directory
      run: |
        mkdir -p release
        mv artifacts/qt-msg-reader-ubuntu-latest/*.tar.gz release/
        mv artifacts/qt-msg-reader-arch/*.pkg.tar.zst release/
        # Windows is opt-in (see build_windows input), so its artifact may not exist.
        if [ -d artifacts/qt-msg-reader-windows-latest ]; then
          mv artifacts/qt-msg-reader-windows-latest/*.zip release/
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.value }}
        name: Release ${{ steps.version.outputs.value }}
        draft: false
        prerelease: false
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
